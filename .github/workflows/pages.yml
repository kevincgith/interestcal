name: Update rates and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * *' # daily 03:15 UTC (11:15 HKT), when HKAB publishes the HIBOR fixing; GitHub usually starts it later
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-rates:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # never let a stalled source hold the job
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch rates
        id: fetch
        # One source failing must not block the other from updating; the job is failed at the end instead.
        continue-on-error: true
        run: npm run fetch-rates
      - run: npm test
      - name: Commit if rates changed
        id: commit
        run: |
          if git diff --quiet site/; then
            echo "Rates unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update interest rate data ($(date -u +%F))"
            git push
          fi
      - name: Keep schedule alive
        # GitHub disables scheduled workflows after 60 days without repo activity;
        # rates often change less often than that. Re-enabling resets the timer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
      - name: Report fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::A rate source failed to update. See the Fetch rates step log."
          exit 1

  deploy:
    needs: refresh-rates
    # Scheduled runs deploy when the rate files changed (including the daily "checked" date); pushes and manual runs always deploy.
    # Runs even if a rate source failed, so any source that did update still goes live.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.refresh-rates.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # pick up the commit refresh-rates may have just pushed
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Browser tests (desktop Chrome + iPhone Safari engine) must pass before the page goes live
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Stamp asset URLs with the commit so browsers fetch fresh CSS/JS after each deploy
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" site/*.html site/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
